<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Shift — BIOL 101 · Ivy Tech 2030</title>
  <style>
    /* ══════════════════════════════════════════════════════════
       DESIGN TOKENS
       Warm off-white bg, deep evergreen primary, soft lavender accent
       ══════════════════════════════════════════════════════════ */
    :root {
      /* Palette */
      --bg:          #faf8f5;      /* warm off-white */
      --surface:     #ffffff;
      --surface-alt: #f4f1ee;      /* slightly warmer card bg */
      --border:      #e0dbd4;
      --green:       #1a4d35;      /* deep evergreen */
      --green-mid:   #2d6a4a;
      --green-lt:    #e8f4ee;      /* tint for hover/selected */
      --lavender:    #7c6fcd;      /* soft lavender accent (selected state) */
      --lavender-lt: #ede9f9;      /* lavender tint */
      --text:        #22201d;
      --text-mid:    #4a4740;
      --muted:       #7a7268;
      --gold:        #c9820a;      /* sample-mode amber */
      --gold-lt:     #fef3dc;
      --focus:       #2563eb;      /* keyboard focus ring */
      --correct-bg:  #e8f5eb;
      --correct-fg:  #1a4d35;
      --correct-border: #5aad70;
      --wrong-bg:    #fdf0f0;
      --wrong-fg:    #8b1a1a;
      --wrong-border:#d87070;
      --radius-sm:   8px;
      --radius:      14px;
      --radius-lg:   20px;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100dvh;
    }

    /* ── Focus ring (keyboard nav) ───────────────────────────── */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ── Skip-to-content (a11y) ──────────────────────────────── */
    .skip-link {
      position: absolute; top: -100px; left: 0;
      background: var(--focus); color: #fff;
      padding: .4rem .9rem; border-radius: 0 0 8px 8px;
      font-size: .9rem; font-weight: 600; z-index: 200;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }

    /* ── App shell ───────────────────────────────────────────── */
    .app-shell {
      max-width: 480px;        /* comfortable phone width */
      margin: 0 auto;
      padding-bottom: 5rem;
    }

    /* ══════════════════════════════════════════════════════════
       HEADER
       ══════════════════════════════════════════════════════════ */
    .header {
      background: var(--green);
      color: #fff;
      padding: .9rem 1rem .8rem;
      position: sticky; top: 0; z-index: 10;
    }
    .header__row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .header__brand {
      display: flex;
      flex-direction: column;
      gap: .05rem;
    }
    .header__app-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.1;
    }
    .header__course {
      font-size: .78rem;
      opacity: .82;
      letter-spacing: .01em;
    }
    .header__right {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-shrink: 0;
    }
    /* "Get help" button in header */
    .btn-help {
      background: rgba(255,255,255,.18);
      border: 1.5px solid rgba(255,255,255,.55);
      color: #fff;
      font-size: .78rem;
      font-weight: 700;
      padding: .35rem .75rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      min-width: 72px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .btn-help:hover { background: rgba(255,255,255,.3); }
    .btn-help:focus-visible { outline-color: #fff; }
    /* Sample mode badge */
    .sample-badge {
      background: var(--gold);
      color: #000;
      font-size: .66rem;
      font-weight: 800;
      padding: .15rem .5rem;
      border-radius: 999px;
      white-space: nowrap;
      display: none;
      letter-spacing: .03em;
    }
    .sample-badge.visible { display: inline-block; }

    /* ══════════════════════════════════════════════════════════
       MATERIAL PICKER SECTION
       ══════════════════════════════════════════════════════════ */
    .picker-section {
      padding: 1.1rem 1rem .9rem;
    }
    .picker-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .55rem;
      display: block;
    }

    /* Material cards (radio-button cards) */
    .material-list {
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }
    .material-card {
      position: relative;
    }
    .material-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }
    .material-card__label {
      display: flex;
      flex-direction: column;
      gap: .15rem;
      padding: .75rem .9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      transition: border-color .12s, background .12s, box-shadow .12s;
      min-height: 52px;
    }
    .material-card__label:hover {
      border-color: var(--green-mid);
      background: var(--green-lt);
    }
    /* Selected state uses lavender */
    .material-card input[type="radio"]:checked + .material-card__label {
      border-color: var(--lavender);
      background: var(--lavender-lt);
      box-shadow: 0 0 0 1px var(--lavender);
    }
    .material-card input[type="radio"]:focus-visible + .material-card__label {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .material-card__meta {
      display: flex;
      gap: .4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .material-card__title {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    /* Pill badges */
    .pill {
      font-size: .66rem;
      font-weight: 700;
      padding: .12rem .45rem;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
      letter-spacing: .02em;
    }
    .pill--reading   { color: #0c5a8a; border-color: #b3d9f2; background: #e6f2fb; }
    .pill--lecture   { color: #4a2080; border-color: #cfc0f0; background: #ede9f9; }
    .pill--week      { color: var(--muted); border-color: var(--border); background: var(--surface-alt); }

    /* CTA button below picker */
    .btn-study {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: .9rem;
      padding: .8rem 1rem;
      background: var(--green);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      min-height: 48px;
      transition: background .15s;
      letter-spacing: .01em;
    }
    .btn-study:hover { background: var(--green-mid); }
    .btn-study:disabled { opacity: .4; cursor: default; }

    /* ══════════════════════════════════════════════════════════
       STUDY AREA (tabs + panels)
       ══════════════════════════════════════════════════════════ */
    .study-area {
      padding: 0 1rem;
    }
    .study-area.hidden { display: none; }

    /* Material title strip above tabs */
    .study-title-bar {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      padding: .85rem 0 .6rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: .1rem;
    }
    .study-title-bar__id {
      font-size: .68rem;
      font-weight: 800;
      color: var(--green-mid);
      background: var(--green-lt);
      border: 1px solid #b6dcca;
      border-radius: 6px;
      padding: .15rem .45rem;
      flex-shrink: 0;
      margin-top: .15rem;
    }
    .study-title-bar__title {
      font-size: .9rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    /* Tab bar */
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1rem;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: .6rem .4rem .55rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: color .12s, border-color .12s;
      white-space: nowrap;
      min-height: 44px;
    }
    .tab-btn:hover { color: var(--green); }
    .tab-btn[aria-selected="true"] {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    .tab-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: -2px;
      border-radius: 4px 4px 0 0;
    }

    /* Tab panels */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ══════════════════════════════════════════════════════════
       QUICK REVIEW PANEL
       ══════════════════════════════════════════════════════════ */
    .review-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin: 0 0 .9rem;
    }
    .review-bullets li {
      display: flex;
      gap: .6rem;
      align-items: flex-start;
      font-size: .95rem;
      line-height: 1.5;
    }
    .review-bullets li::before {
      content: "▸";
      color: var(--green-mid);
      flex-shrink: 0;
      margin-top: .05rem;
      font-size: .85rem;
    }
    /* Course term emphasis inside bullets */
    .term-em {
      font-weight: 700;
      color: var(--green);
    }

    /* ══════════════════════════════════════════════════════════
       KEY TERMS PANEL
       ══════════════════════════════════════════════════════════ */
    .terms-list {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }
    .term-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .7rem .85rem;
    }
    .term-card__term {
      font-weight: 700;
      font-size: .95rem;
      color: var(--green);
      margin-bottom: .2rem;
    }
    .term-card__def {
      font-size: .88rem;
      color: var(--text-mid);
      line-height: 1.55;
    }

    /* ══════════════════════════════════════════════════════════
       PRACTICE PANEL
       ══════════════════════════════════════════════════════════ */
    .practice-q {
      font-size: .97rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: .85rem;
      color: var(--text);
    }
    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-bottom: .85rem;
    }
    .options-list li { position: relative; }
    .options-list input[type="radio"] {
      position: absolute;
      opacity: 0; width: 0; height: 0;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: .65rem;
      padding: .7rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: .93rem;
      line-height: 1.4;
      background: var(--surface);
      transition: border-color .1s, background .1s;
      min-height: 48px;
    }
    .option-label:hover { border-color: var(--green-mid); background: var(--green-lt); }
    .options-list input[type="radio"]:checked + .option-label {
      border-color: var(--lavender);
      background: var(--lavender-lt);
      box-shadow: 0 0 0 1px var(--lavender);
    }
    .options-list input[type="radio"]:focus-visible + .option-label {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    /* Letter chip */
    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      font-size: .75rem;
      font-weight: 800;
      flex-shrink: 0;
      color: var(--muted);
      background: var(--surface-alt);
      margin-top: .05rem;
    }
    .options-list input[type="radio"]:checked + .option-label .opt-letter {
      border-color: var(--lavender);
      color: var(--lavender);
      background: #fff;
    }

    /* Post-submit feedback states */
    .option-label.state-correct {
      border-color: var(--correct-border) !important;
      background: var(--correct-bg) !important;
      box-shadow: none !important;
    }
    .option-label.state-correct .opt-letter {
      border-color: var(--correct-border);
      color: var(--correct-fg);
      background: #fff;
    }
    .option-label.state-wrong {
      border-color: var(--wrong-border) !important;
      background: var(--wrong-bg) !important;
      box-shadow: none !important;
    }
    .option-label.state-wrong .opt-letter {
      border-color: var(--wrong-border);
      color: var(--wrong-fg);
      background: #fff;
    }
    /* Icon symbol next to letter for color-independent feedback */
    .opt-icon {
      display: none;
      font-size: .85rem;
      margin-left: .15rem;
    }
    .state-correct .opt-icon { display: inline; }
    .state-wrong   .opt-icon { display: inline; }

    /* Submit button */
    .btn-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: .75rem 1rem;
      background: var(--green);
      color: #fff;
      font-size: .97rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      min-height: 48px;
      transition: background .15s;
    }
    .btn-submit:hover { background: var(--green-mid); }
    .btn-submit:disabled { opacity: .38; cursor: default; }

    /* Answer feedback block */
    .answer-feedback {
      display: none;
      margin-top: .9rem;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .answer-feedback.visible { display: block; }
    .feedback-banner {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .6rem .85rem;
      font-size: .9rem;
      font-weight: 700;
    }
    .feedback-banner.correct { background: var(--correct-bg); color: var(--correct-fg); border: 1px solid var(--correct-border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .feedback-banner.wrong   { background: var(--wrong-bg);   color: var(--wrong-fg);   border: 1px solid var(--wrong-border);  border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .feedback-body {
      padding: .7rem .85rem;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      background: var(--surface);
    }
    .feedback-explanation {
      font-size: .9rem;
      line-height: 1.6;
      color: var(--text-mid);
      margin-bottom: .6rem;
    }
    .source-quote {
      border-left: 3px solid var(--green-mid);
      padding: .4rem .65rem;
      background: var(--green-lt);
      border-radius: 0 6px 6px 0;
      font-size: .8rem;
      color: var(--muted);
    }
    .source-quote__label {
      font-size: .66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--green-mid);
      display: block;
      margin-bottom: .15rem;
    }

    /* ══════════════════════════════════════════════════════════
       SHARED SECTION FOOTER (sample content notice)
       ══════════════════════════════════════════════════════════ */
    .sample-notice {
      display: none;
      align-items: center;
      gap: .4rem;
      margin-top: .9rem;
      padding: .5rem .7rem;
      background: var(--gold-lt);
      border: 1px solid #f5d78e;
      border-radius: var(--radius-sm);
      font-size: .78rem;
      color: #7a5500;
    }
    .sample-notice.visible { display: flex; }
    .sample-notice__icon { font-size: .9rem; flex-shrink: 0; }

    /* ══════════════════════════════════════════════════════════
       HELP PANEL (bottom of page)
       ══════════════════════════════════════════════════════════ */
    .help-section {
      padding: 1rem 1rem 0;
      border-top: 1px solid var(--border);
      margin-top: 1.5rem;
    }
    .help-section__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .4rem;
    }
    .help-section__title {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
    }
    .btn-toggle {
      background: none; border: none;
      font-size: .82rem; font-weight: 600;
      color: var(--green); cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0;
    }
    .help-cards {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      margin-top: .6rem;
    }
    .help-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .7rem .85rem;
    }
    .help-card__name  { font-weight: 700; font-size: .9rem; }
    .help-card__role  { font-size: .78rem; color: var(--muted); margin-bottom: .25rem; }
    .help-card__link  { font-size: .82rem; color: var(--green); text-decoration: none; }
    .help-card__link:hover { text-decoration: underline; }
    .help-card__hours { font-size: .75rem; color: var(--muted); margin-top: .12rem; }

    /* ══════════════════════════════════════════════════════════
       SPINNER
       ══════════════════════════════════════════════════════════ */
    .spinner {
      display: inline-block;
      width: 1rem; height: 1rem;
      border: 2px solid #c5dece;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE — tighten at very narrow widths
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 360px) {
      .tab-btn      { font-size: .75rem; padding: .55rem .3rem; }
      .header__app-name { font-size: 1rem; }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">

  <!-- ══════════════════════════════════════════════════════════
       HEADER
       ══════════════════════════════════════════════════════════ -->
  <header class="header" role="banner">
    <div class="header__row1">
      <div class="header__brand">
        <span class="header__app-name">Study Shift</span>
        <span class="header__course" id="course-label">BIOL 101</span>
      </div>
      <div class="header__right">
        <span class="sample-badge" id="sample-mode-badge" aria-live="polite">⚠ Sample content</span>
        <button class="btn-help" id="get-help-btn" type="button"
                aria-expanded="false" aria-controls="help-section-body">
          Get help
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">

    <!-- ══════════════════════════════════════════════════════
         SECTION 1 — Material picker
         ══════════════════════════════════════════════════════ -->
    <section class="picker-section" aria-labelledby="picker-label">
      <span class="picker-label" id="picker-label">Choose your material</span>

      <div class="material-list" id="material-list" role="radiogroup"
           aria-labelledby="picker-label">
        <!-- populated by JS: renderMaterialCards() -->
      </div>

      <button class="btn-study" id="study-btn" type="button" disabled>
        Start studying
      </button>
    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 2 — Study area (tabs)
         ══════════════════════════════════════════════════════ -->
    <section class="study-area hidden" id="study-area" aria-labelledby="study-title-text">

      <!-- Material title strip -->
      <div class="study-title-bar">
        <span class="study-title-bar__id" id="study-material-id"></span>
        <span class="study-title-bar__title" id="study-title-text"></span>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar" role="tablist" aria-label="Study views">
        <button class="tab-btn" role="tab" id="tab-review"   aria-selected="true"  aria-controls="panel-review"   type="button">Quick review</button>
        <button class="tab-btn" role="tab" id="tab-terms"    aria-selected="false" aria-controls="panel-terms"    type="button">Key terms</button>
        <button class="tab-btn" role="tab" id="tab-practice" aria-selected="false" aria-controls="panel-practice" type="button">Practice</button>
      </div>

      <!-- Panel: Quick review -->
      <div class="tab-panel active" role="tabpanel" id="panel-review" aria-labelledby="tab-review" tabindex="0">
        <div id="review-content">
          <!-- populated by renderReview() -->
        </div>
      </div>

      <!-- Panel: Key terms -->
      <div class="tab-panel" role="tabpanel" id="panel-terms" aria-labelledby="tab-terms" tabindex="0">
        <div id="terms-content">
          <!-- populated by renderTerms() -->
        </div>
      </div>

      <!-- Panel: Practice -->
      <div class="tab-panel" role="tabpanel" id="panel-practice" aria-labelledby="tab-practice" tabindex="0">
        <div id="practice-content">
          <!-- populated by renderPractice() -->
        </div>
      </div>

    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 3 — Help (always visible at bottom)
         ══════════════════════════════════════════════════════ -->
    <section class="help-section" id="help-section" aria-labelledby="help-title">
      <div class="help-section__header">
        <span class="help-section__title" id="help-title">Need a person?</span>
        <button class="btn-toggle" id="help-toggle-btn"
                type="button" aria-expanded="false" aria-controls="help-section-body">
          Show ▾
        </button>
      </div>
      <div id="help-section-body" class="help-cards hidden">
        <!-- populated by renderHelp() -->
      </div>
    </section>

  </main>
</div><!-- /app-shell -->

<!-- ══════════════════════════════════════════════════════════════
     ES MODULE — all application logic
     ══════════════════════════════════════════════════════════════ -->
<script type="module">
import { COURSE, MATERIALS, QUESTION_BANK, KEY_TERMS, HELP_DIRECTORY } from './case_data.js';

/* ══════════════════════════════════════════════════════════════
   GLOBAL STATE
   ══════════════════════════════════════════════════════════════ */
const state = {
  isSampleMode:     false,
  currentMaterial:  null,   // MATERIALS entry
  currentQuestion:  null,   // QUESTION_BANK entry
  quizAnswered:     false,
  selectedOption:   null,   // "A"|"B"|"C"|"D"
};

/* ══════════════════════════════════════════════════════════════
   AI STUB
   Replace this body to wire a real endpoint, e.g.:
     const res = await fetch('/api/generate', {
       method: 'POST',
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({ prompt })
     });
     return res.json(); // expects { text: string }
   ══════════════════════════════════════════════════════════════ */
async function callAI(prompt) {
  throw new Error("AI service unavailable — using sample content");
}

/* ══════════════════════════════════════════════════════════════
   SAMPLE GENERATORS (fallback when AI unavailable)
   ══════════════════════════════════════════════════════════════ */
function buildSampleBullets(material) {
  // Split source text into sentences; return first 5 as bullet strings
  const raw = material.source_text.match(/[^.!?]+[.!?]+/g) || [];
  return raw.slice(0, 5).map(s => s.trim()).filter(Boolean);
}

function pickSampleQuestion(materialId) {
  const pool = QUESTION_BANK[materialId];
  if (!pool || pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Wrap recognized course terms in <span class="term-em"> inside a string.
// Terms are sourced from KEY_TERMS for the current material.
function highlightTerms(text, materialId) {
  const terms = (KEY_TERMS[materialId] || []).map(t => t.term);
  if (!terms.length) return escHtml(text);
  // Sort longest first so multi-word terms match before substrings
  const sorted = [...terms].sort((a, b) => b.length - a.length);
  const pattern = new RegExp(`(${sorted.map(t =>
    t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
  ).join('|')})`, 'gi');
  return escHtml(text).replace(
    new RegExp(`(${sorted.map(t =>
      escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    ).join('|')})`, 'gi'),
    '<span class="term-em">$1</span>'
  );
}

function activateSampleMode() {
  if (state.isSampleMode) return;
  state.isSampleMode = true;
  document.getElementById('sample-mode-badge').classList.add('visible');
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 1 — Material picker cards
   ══════════════════════════════════════════════════════════════ */
// Derive week number from material index among assigned items (W01, W02…)
function weekLabel(index) {
  return `Week ${String(index + 1).padStart(2, '0')}`;
}

function renderMaterialCards() {
  const container = document.getElementById('material-list');
  const assigned = MATERIALS.filter(m => m.assigned_by_instructor);  // M06/M10 excluded

  container.innerHTML = assigned.map((m, i) => {
    const typeClass  = m.type === 'reading' ? 'pill--reading' : 'pill--lecture';
    const typeLabel  = m.type === 'reading' ? '📄 Reading' : '📝 Lecture Notes';
    return `
      <div class="material-card">
        <input type="radio" name="material" id="mat-${m.id}" value="${m.id}"
               aria-labelledby="mat-label-${m.id}" />
        <label class="material-card__label" id="mat-label-${m.id}" for="mat-${m.id}">
          <div class="material-card__meta">
            <span class="pill pill--week">${weekLabel(i)}</span>
            <span class="pill ${typeClass}">${typeLabel}</span>
          </div>
          <div class="material-card__title">${escHtml(m.title)}</div>
        </label>
      </div>
    `;
  }).join('');

  // Enable Start button when a card is selected; track currentMaterial
  container.addEventListener('change', e => {
    if (e.target.name !== 'material') return;
    const m = MATERIALS.find(x => x.id === e.target.value);
    state.currentMaterial = m;
    document.getElementById('study-btn').disabled = false;
  });

  document.getElementById('study-btn').addEventListener('click', onStudyClick);
}

function onStudyClick() {
  const m = state.currentMaterial;
  if (!m) return;

  // Reset quiz state whenever a new material is selected
  resetQuizState();

  // Update title strip
  document.getElementById('study-material-id').textContent = m.id;
  document.getElementById('study-title-text').textContent  = m.title;

  // Show study area, switch to Quick Review tab
  document.getElementById('study-area').classList.remove('hidden');
  switchTab('review');

  // Render all three panels for this material
  renderReview(m);
  renderTerms(m);
  renderPractice(m);

  document.getElementById('study-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══════════════════════════════════════════════════════════════
   TABS
   ══════════════════════════════════════════════════════════════ */
function switchTab(name) {
  ['review','terms','practice'].forEach(id => {
    document.getElementById(`tab-${id}`).setAttribute('aria-selected', id === name ? 'true' : 'false');
    document.getElementById(`panel-${id}`).classList.toggle('active', id === name);
  });
}

function initTabs() {
  ['review','terms','practice'].forEach(id => {
    document.getElementById(`tab-${id}`).addEventListener('click', () => switchTab(id));
  });
  // Arrow-key keyboard navigation between tabs
  document.querySelector('[role="tablist"]').addEventListener('keydown', e => {
    const tabs = ['review','terms','practice'];
    const current = tabs.findIndex(id =>
      document.getElementById(`tab-${id}`).getAttribute('aria-selected') === 'true'
    );
    let next = -1;
    if (e.key === 'ArrowRight') next = (current + 1) % tabs.length;
    if (e.key === 'ArrowLeft')  next = (current + 2) % tabs.length;
    if (next >= 0) {
      e.preventDefault();
      switchTab(tabs[next]);
      document.getElementById(`tab-${tabs[next]}`).focus();
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 2 — Quick Review (bullets + source excerpt)
   ══════════════════════════════════════════════════════════════ */
async function renderReview(material) {
  const container = document.getElementById('review-content');
  container.innerHTML = `<span class="spinner" aria-hidden="true"></span> Building review…`;

  let bullets;
  let usedSample = false;

  try {
    const result = await callAI(
      `Summarize the following biology study material as 4-5 short bullets for a college student. ` +
      `Keep important course terms. Material: "${material.source_text}"`
    );
    // Expect result.text to be newline-separated bullet strings
    bullets = result.text.split('\n').map(l => l.replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
  } catch {
    bullets = buildSampleBullets(material);
    usedSample = true;
  }

  if (usedSample) activateSampleMode();

  const bulletHTML = bullets.map(b =>
    `<li>${highlightTerms(b, material.id)}</li>`
  ).join('');

  container.innerHTML = `
    <ul class="review-bullets" aria-label="Quick review bullets">
      ${bulletHTML}
    </ul>
    <div class="source-quote">
      <span class="source-quote__label">From ${escHtml(material.id)}</span>
      ${escHtml(material.excerpt)}
    </div>
    ${usedSample ? sampleNoticeHTML('Quick review built from source text') : ''}
  `;
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 3 — Key Terms
   ══════════════════════════════════════════════════════════════ */
function renderTerms(material) {
  const container = document.getElementById('terms-content');
  const terms = KEY_TERMS[material.id] || [];
  const usedSample = true; // key_terms.csv not yet on disk — always sample

  activateSampleMode();

  if (!terms.length) {
    container.innerHTML = `<p style="font-size:.88rem;color:var(--muted);">No key terms loaded for this material yet.</p>`;
    return;
  }

  const cardsHTML = terms.map(t => `
    <div class="term-card">
      <div class="term-card__term">${escHtml(t.term)}</div>
      <div class="term-card__def">${escHtml(t.definition)}</div>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="terms-list" aria-label="Key terms">
      ${cardsHTML}
    </div>
    ${sampleNoticeHTML('Terms from built-in glossary · will update from data/key_terms.csv')}
  `;
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 4 — Practice (pick → submit → feedback)
   ══════════════════════════════════════════════════════════════ */
async function renderPractice(material) {
  const container = document.getElementById('practice-content');
  container.innerHTML = `<span class="spinner" aria-hidden="true"></span> Loading question…`;

  let q;
  let usedSample = false;

  try {
    // AI-generated question path (will also set usedSample=false)
    await callAI(`Generate one multiple-choice question from: "${material.source_text}"`);
    // If AI returns, parse result into q — not reached today
  } catch {
    q = pickSampleQuestion(material.id);
    usedSample = true;
  }

  if (usedSample) activateSampleMode();

  if (!q) {
    container.innerHTML = `<p style="font-size:.88rem;color:var(--muted);">No practice question available for this material yet.</p>`;
    return;
  }

  state.currentQuestion = q;
  state.quizAnswered     = false;
  state.selectedOption   = null;

  _renderPracticeUI(material, q, usedSample);
}

function _renderPracticeUI(material, q, isSample) {
  const optLetters = ['A','B','C','D'];
  const container  = document.getElementById('practice-content');

  const optionsHTML = q.options.map((opt, i) => {
    const letter = optLetters[i];
    return `
      <li>
        <input type="radio" name="practice-opt" id="opt-${letter}" value="${letter}"
               aria-label="Option ${letter}: ${escHtml(opt)}" />
        <label class="option-label" for="opt-${letter}">
          <span class="opt-letter" aria-hidden="true">${letter}<span class="opt-icon"></span></span>
          <span>${escHtml(opt)}</span>
        </label>
      </li>
    `;
  }).join('');

  container.innerHTML = `
    <p class="material-id-line" style="font-size:.7rem;color:var(--muted);margin-bottom:.6rem;">
      ${escHtml(material.id)} · ${escHtml(material.title)}
    </p>
    ${isSample ? `<div style="margin-bottom:.65rem;">${sampleQuestionBadgeHTML()}</div>` : ''}
    <p class="practice-q" id="practice-question-text">${escHtml(q.question)}</p>
    <ul class="options-list" role="list" aria-labelledby="practice-question-text">
      ${optionsHTML}
    </ul>
    <button class="btn-submit" id="submit-btn" type="button" disabled>
      Submit answer
    </button>
    <div class="answer-feedback" id="answer-feedback" aria-live="polite"></div>
    ${isSample ? sampleNoticeHTML('Sample question from question bank (not AI-generated)') : ''}
  `;

  // Enable submit when an option is chosen
  container.querySelectorAll('input[name="practice-opt"]').forEach(radio => {
    radio.addEventListener('change', () => {
      state.selectedOption = radio.value;
      document.getElementById('submit-btn').disabled = false;
    });
  });

  document.getElementById('submit-btn').addEventListener('click', () => revealAnswer(material, q));
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 5 — Answer reveal
   Idempotent: second click does nothing.
   ══════════════════════════════════════════════════════════════ */
function revealAnswer(material, q) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const selected   = state.selectedOption;
  const isCorrect  = selected === q.answer;
  const optLetters = ['A','B','C','D'];

  // Apply state classes to all labels; icons give color-independent feedback
  optLetters.forEach(letter => {
    const label = document.querySelector(`label[for="opt-${letter}"]`);
    const icon  = label && label.querySelector('.opt-icon');
    const input = document.getElementById(`opt-${letter}`);
    if (!label) return;
    if (letter === q.answer) {
      label.classList.add('state-correct');
      if (icon) icon.textContent = ' ✓';
    } else if (letter === selected && !isCorrect) {
      label.classList.add('state-wrong');
      if (icon) icon.textContent = ' ✗';
    }
    input.disabled = true;
  });

  document.getElementById('submit-btn').disabled = true;

  const bannerClass = isCorrect ? 'correct' : 'wrong';
  const bannerText  = isCorrect
    ? '✓ Correct!'
    : `✗ Not quite — the right answer is ${q.answer}.`;

  const feedbackEl = document.getElementById('answer-feedback');
  feedbackEl.innerHTML = `
    <div class="feedback-banner ${bannerClass}" role="alert">${bannerText}</div>
    <div class="feedback-body">
      <p class="feedback-explanation">${escHtml(q.explanation)}</p>
      <div class="source-quote">
        <span class="source-quote__label">Source — ${escHtml(material.id)}</span>
        ${escHtml(q.source_excerpt)}
      </div>
    </div>
  `;
  feedbackEl.classList.add('visible');
  feedbackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 6 — Help directory
   ══════════════════════════════════════════════════════════════ */
function renderHelp() {
  const body = document.getElementById('help-section-body');
  body.innerHTML = HELP_DIRECTORY.map(h => `
    <div class="help-card">
      <div class="help-card__name">${escHtml(h.name)}</div>
      <div class="help-card__role">${escHtml(h.role)}</div>
      <a class="help-card__link" href="mailto:${escHtml(h.contact)}">${escHtml(h.contact)}</a>
      ${h.phone ? `<div class="help-card__hours">${escHtml(h.phone)}</div>` : ''}
      <div class="help-card__hours">${escHtml(h.hours)}</div>
    </div>
  `).join('');

  // Both the top-bar "Get help" button and the section toggle open the same list
  function toggleHelp(btn) {
    const expanded = body.classList.toggle('hidden');
    const isOpen   = !expanded;
    btn.setAttribute('aria-expanded', String(isOpen));
    btn.textContent = isOpen
      ? (btn.id === 'help-toggle-btn' ? 'Hide ▴' : 'Get help')
      : (btn.id === 'help-toggle-btn' ? 'Show ▾' : 'Get help');
    if (isOpen && btn.id === 'get-help-btn') {
      document.getElementById('help-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  document.getElementById('help-toggle-btn').addEventListener('click', e => toggleHelp(e.currentTarget));
  document.getElementById('get-help-btn').addEventListener('click', e => {
    // Always open (never toggle from header)
    if (body.classList.contains('hidden')) body.classList.remove('hidden');
    document.getElementById('help-toggle-btn').textContent = 'Hide ▴';
    document.getElementById('help-toggle-btn').setAttribute('aria-expanded', 'true');
    document.getElementById('help-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ══════════════════════════════════════════════════════════════
   QUIZ RESET — called when material changes
   ══════════════════════════════════════════════════════════════ */
function resetQuizState() {
  state.quizAnswered   = false;
  state.selectedOption = null;
  state.currentQuestion = null;
  // The practice-content div is re-rendered by renderPractice(), which
  // creates fresh radio buttons and a fresh feedback block, so stale
  // answer state cannot persist under a new material.
}

/* ══════════════════════════════════════════════════════════════
   SMALL HTML BUILDERS
   ══════════════════════════════════════════════════════════════ */
function sampleNoticeHTML(msg) {
  return `
    <div class="sample-notice visible" role="note">
      <span class="sample-notice__icon" aria-hidden="true">ℹ</span>
      <span>Sample content — ${escHtml(msg)}</span>
    </div>
  `;
}

function sampleQuestionBadgeHTML() {
  return `<span style="
    display:inline-block;font-size:.68rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;
    background:var(--gold-lt);border:1px solid #f5d78e;
    color:#7a5500;border-radius:999px;padding:.12rem .5rem;">
    Sample practice question
  </span>`;
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
(function boot() {
  document.getElementById('course-label').textContent =
    `${COURSE.id} · ${COURSE.section}`;

  renderMaterialCards();
  initTabs();
  renderHelp();
})();
</script>
