<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Shift — BIOL 101 · Ivy Tech 2030</title>
  <style>
    /* ══════════════════════════════════════════════════════════
       DESIGN TOKENS
       ══════════════════════════════════════════════════════════ */
    :root {
      --bg:          #faf8f5;
      --surface:     #ffffff;
      --surface-alt: #f4f1ee;
      --border:      #e0dbd4;
      --green:       #1a4d35;
      --green-mid:   #2d6a4a;
      --green-lt:    #e8f4ee;
      --lavender:    #7c6fcd;
      --lavender-lt: #ede9f9;
      --text:        #22201d;
      --text-mid:    #4a4740;
      --muted:       #7a7268;
      --gold:        #c9820a;
      --gold-lt:     #fef3dc;
      --focus:       #2563eb;
      --correct-bg:  #e8f5eb;
      --correct-fg:  #1a4d35;
      --correct-border: #5aad70;
      --wrong-bg:    #fdf0f0;
      --wrong-fg:    #8b1a1a;
      --wrong-border:#d87070;
      --radius-sm:   8px;
      --radius:      14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100dvh;
    }
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      border-radius: 4px;
    }
    .skip-link {
      position: absolute; top: -100px; left: 0;
      background: var(--focus); color: #fff;
      padding: .4rem .9rem; border-radius: 0 0 8px 8px;
      font-size: .9rem; font-weight: 600; z-index: 200;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }
    .app-shell { max-width: 480px; margin: 0 auto; padding-bottom: 5rem; }

    /* ══ HEADER ════════════════════════════════════════════════ */
    .header {
      background: var(--green); color: #fff;
      padding: .9rem 1rem .8rem;
      position: sticky; top: 0; z-index: 10;
    }
    .header__row1 {
      display: flex; align-items: center;
      justify-content: space-between; gap: .5rem;
    }
    .header__brand { display: flex; flex-direction: column; gap: .05rem; }
    .header__app-name { font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
    .header__course  { font-size: .78rem; opacity: .82; letter-spacing: .01em; }
    .header__right   { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    .btn-help {
      background: rgba(255,255,255,.18);
      border: 1.5px solid rgba(255,255,255,.55);
      color: #fff; font-size: .78rem; font-weight: 700;
      padding: .35rem .75rem; border-radius: 999px; cursor: pointer;
      white-space: nowrap; min-height: 36px; min-width: 72px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .btn-help:hover { background: rgba(255,255,255,.3); }
    .btn-help:focus-visible { outline-color: #fff; }
    .sample-badge {
      background: var(--gold); color: #000;
      font-size: .66rem; font-weight: 800;
      padding: .15rem .5rem; border-radius: 999px;
      white-space: nowrap; display: none; letter-spacing: .03em;
    }
    .sample-badge.visible { display: inline-block; }

    /* ══ MATERIAL PICKER ═══════════════════════════════════════ */
    .picker-section { padding: 1.1rem 1rem .9rem; }
    .picker-label {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted);
      margin-bottom: .55rem; display: block;
    }
    .material-list { display: flex; flex-direction: column; gap: .55rem; }
    .material-card { position: relative; }
    .material-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .material-card__label {
      display: flex; flex-direction: column; gap: .15rem;
      padding: .75rem .9rem; border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--surface);
      cursor: pointer; min-height: 52px;
      transition: border-color .12s, background .12s, box-shadow .12s;
    }
    .material-card__label:hover { border-color: var(--green-mid); background: var(--green-lt); }
    .material-card input[type="radio"]:checked + .material-card__label {
      border-color: var(--lavender); background: var(--lavender-lt);
      box-shadow: 0 0 0 1px var(--lavender);
    }
    .material-card input[type="radio"]:focus-visible + .material-card__label {
      outline: 3px solid var(--focus); outline-offset: 2px;
    }
    .material-card__meta { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
    .material-card__title { font-size: .95rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .pill {
      font-size: .66rem; font-weight: 700; padding: .12rem .45rem;
      border-radius: 999px; border: 1px solid; white-space: nowrap; letter-spacing: .02em;
    }
    .pill--reading { color: #0c5a8a; border-color: #b3d9f2; background: #e6f2fb; }
    .pill--lecture { color: #4a2080; border-color: #cfc0f0; background: #ede9f9; }
    .pill--week    { color: var(--muted); border-color: var(--border); background: var(--surface-alt); }
    .btn-study {
      display: flex; align-items: center; justify-content: center;
      width: 100%; margin-top: .9rem; padding: .8rem 1rem;
      background: var(--green); color: #fff;
      font-size: 1rem; font-weight: 700; border: none;
      border-radius: var(--radius); cursor: pointer; min-height: 48px;
      transition: background .15s; letter-spacing: .01em;
    }
    .btn-study:hover { background: var(--green-mid); }
    .btn-study:disabled { opacity: .4; cursor: default; }

    /* ══ STUDY AREA ════════════════════════════════════════════ */
    .study-area { padding: 0 1rem; }
    .study-area.hidden { display: none; }
    .study-title-bar {
      display: flex; align-items: flex-start; gap: .6rem;
      padding: .85rem 0 .6rem; border-bottom: 1px solid var(--border); margin-bottom: .1rem;
    }
    .study-title-bar__id {
      font-size: .68rem; font-weight: 800; color: var(--green-mid);
      background: var(--green-lt); border: 1px solid #b6dcca;
      border-radius: 6px; padding: .15rem .45rem; flex-shrink: 0; margin-top: .15rem;
    }
    .study-title-bar__title { font-size: .9rem; font-weight: 700; color: var(--text); line-height: 1.3; }

    /* ── Tab bar ─────────────────────────────────────────────── */
    .tab-bar {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 2px solid var(--border); margin-bottom: 1rem;
    }
    .tab-btn {
      background: none; border: none;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      padding: .6rem .4rem .55rem; font-size: .82rem; font-weight: 600;
      color: var(--muted); cursor: pointer; text-align: center;
      transition: color .12s, border-color .12s; white-space: nowrap; min-height: 44px;
    }
    .tab-btn:hover { color: var(--green); }
    .tab-btn[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
    .tab-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: -2px; border-radius: 4px 4px 0 0; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── RB1: Reading-level / language toggle ─────────────────── */
    .level-toggle {
      display: flex; gap: .4rem; margin-bottom: .9rem;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface-alt); padding: .2rem;
      width: fit-content;
    }
    .level-btn {
      background: none; border: none; border-radius: 999px;
      font-size: .78rem; font-weight: 600; color: var(--muted);
      padding: .3rem .75rem; cursor: pointer; min-height: 32px;
      transition: background .12s, color .12s;
    }
    .level-btn[aria-pressed="true"] {
      background: var(--green); color: #fff;
    }
    .level-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    /* ── Quick review ─────────────────────────────────────────── */
    .review-bullets {
      list-style: none; display: flex; flex-direction: column;
      gap: .5rem; margin: 0 0 .9rem;
    }
    .review-bullets li {
      display: flex; gap: .6rem; align-items: flex-start;
      font-size: .95rem; line-height: 1.5;
    }
    .review-bullets li::before {
      content: "▸"; color: var(--green-mid); flex-shrink: 0;
      margin-top: .05rem; font-size: .85rem;
    }
    .term-em { font-weight: 700; color: var(--green); }

    /* ── Key terms ────────────────────────────────────────────── */
    .terms-list { display: flex; flex-direction: column; gap: .6rem; }
    .term-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .7rem .85rem;
    }
    .term-card__term { font-weight: 700; font-size: .95rem; color: var(--green); margin-bottom: .2rem; }
    .term-card__def  { font-size: .88rem; color: var(--text-mid); line-height: 1.55; }

    /* ── Practice ─────────────────────────────────────────────── */
    .practice-q {
      font-size: .97rem; font-weight: 600; line-height: 1.45;
      margin-bottom: .85rem; color: var(--text);
    }
    .options-list {
      list-style: none; display: flex; flex-direction: column;
      gap: .5rem; margin-bottom: .85rem;
    }
    .options-list li { position: relative; }
    .options-list input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .option-label {
      display: flex; align-items: flex-start; gap: .65rem;
      padding: .7rem .85rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: .93rem; line-height: 1.4; background: var(--surface);
      transition: border-color .1s, background .1s; min-height: 48px;
    }
    .option-label:hover { border-color: var(--green-mid); background: var(--green-lt); }
    .options-list input[type="radio"]:checked + .option-label {
      border-color: var(--lavender); background: var(--lavender-lt);
      box-shadow: 0 0 0 1px var(--lavender);
    }
    .options-list input[type="radio"]:focus-visible + .option-label {
      outline: 3px solid var(--focus); outline-offset: 2px;
    }
    .opt-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      border: 1.5px solid var(--border); font-size: .75rem; font-weight: 800;
      flex-shrink: 0; color: var(--muted); background: var(--surface-alt); margin-top: .05rem;
    }
    .options-list input[type="radio"]:checked + .option-label .opt-letter {
      border-color: var(--lavender); color: var(--lavender); background: #fff;
    }
    .option-label.state-correct { border-color: var(--correct-border) !important; background: var(--correct-bg) !important; box-shadow: none !important; }
    .option-label.state-correct .opt-letter { border-color: var(--correct-border); color: var(--correct-fg); background: #fff; }
    .option-label.state-wrong   { border-color: var(--wrong-border) !important;   background: var(--wrong-bg) !important;   box-shadow: none !important; }
    .option-label.state-wrong   .opt-letter { border-color: var(--wrong-border);   color: var(--wrong-fg);   background: #fff; }
    .opt-icon { display: none; font-size: .85rem; margin-left: .15rem; }
    .state-correct .opt-icon { display: inline; }
    .state-wrong   .opt-icon { display: inline; }

    .btn-submit {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: .75rem 1rem; background: var(--green); color: #fff;
      font-size: .97rem; font-weight: 700; border: none;
      border-radius: var(--radius); cursor: pointer; min-height: 48px;
      transition: background .15s;
    }
    .btn-submit:hover { background: var(--green-mid); }
    .btn-submit:disabled { opacity: .38; cursor: default; }

    /* ── Answer feedback ──────────────────────────────────────── */
    .answer-feedback { display: none; margin-top: .9rem; border-radius: var(--radius-sm); overflow: hidden; }
    .answer-feedback.visible { display: block; }
    .feedback-banner {
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem .85rem; font-size: .9rem; font-weight: 700;
    }
    .feedback-banner.correct { background: var(--correct-bg); color: var(--correct-fg); border: 1px solid var(--correct-border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .feedback-banner.wrong   { background: var(--wrong-bg);   color: var(--wrong-fg);   border: 1px solid var(--wrong-border);  border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .feedback-body {
      padding: .7rem .85rem; border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--surface);
    }
    .feedback-explanation { font-size: .9rem; line-height: 1.6; color: var(--text-mid); margin-bottom: .6rem; }

    /* ── RB2: View source disclosure ──────────────────────────── */
    .source-disclosure { margin-top: .65rem; }
    .source-disclosure summary {
      display: flex; align-items: center; gap: .4rem;
      font-size: .78rem; font-weight: 700; color: var(--green-mid);
      cursor: pointer; list-style: none; padding: .3rem 0;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .source-disclosure summary::-webkit-details-marker { display: none; }
    .source-disclosure summary::before { content: "▸"; font-size: .7rem; transition: transform .15s; }
    .source-disclosure[open] summary::before { transform: rotate(90deg); }
    .source-disclosure:focus-within summary { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    .source-disclosure__body {
      border-left: 3px solid var(--green-mid); padding: .5rem .75rem;
      background: var(--green-lt); border-radius: 0 6px 6px 0;
      margin-top: .35rem;
    }
    .source-disclosure__meta {
      display: flex; gap: .5rem; flex-wrap: wrap;
      margin-bottom: .35rem;
    }
    .source-meta-pill {
      font-size: .66rem; font-weight: 700; padding: .1rem .4rem;
      border-radius: 999px; border: 1px solid;
    }
    .source-meta-pill--assigned { color: #065f46; border-color: #a7f3d0; background: #d1fae5; }
    .source-meta-pill--mid      { color: var(--green-mid); border-color: #b6dcca; background: #fff; }
    .source-excerpt-text { font-size: .82rem; color: var(--muted); line-height: 1.55; }
    .source-label { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--green-mid); display: block; margin-bottom: .15rem; }

    /* ── Shared sample notice ─────────────────────────────────── */
    .sample-notice {
      display: none; align-items: center; gap: .4rem; margin-top: .9rem;
      padding: .5rem .7rem; background: var(--gold-lt);
      border: 1px solid #f5d78e; border-radius: var(--radius-sm);
      font-size: .78rem; color: #7a5500;
    }
    .sample-notice.visible { display: flex; }
    .sample-notice__icon { font-size: .9rem; flex-shrink: 0; }

    /* ══ RB3: HELP PANEL ═══════════════════════════════════════ */
    .help-section {
      padding: 1rem 1rem 0; border-top: 1px solid var(--border); margin-top: 1.5rem;
    }
    .help-section__header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem;
    }
    .help-section__title { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .btn-toggle {
      background: none; border: none; font-size: .82rem; font-weight: 600;
      color: var(--green); cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px; padding: 0;
    }
    .help-cards { display: flex; flex-direction: column; gap: .7rem; margin-top: .6rem; }
    .help-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .75rem .9rem;
    }
    .help-card--featured { border-color: var(--green-mid); border-width: 2px; }
    .help-card__badge {
      display: inline-block; font-size: .62rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .05em;
      padding: .1rem .4rem; border-radius: 999px; margin-bottom: .4rem;
    }
    .help-card__badge--24h  { background: #e8f4ee; color: var(--green-mid); border: 1px solid #b6dcca; }
    .help-card__badge--sample { background: var(--gold-lt); color: #7a5500; border: 1px solid #f5d78e; }
    .help-card__name  { font-weight: 700; font-size: .92rem; margin-bottom: .1rem; }
    .help-card__best  { font-size: .82rem; color: var(--text-mid); margin-bottom: .3rem; line-height: 1.4; }
    .help-card__avail { font-size: .76rem; color: var(--muted); margin-bottom: .35rem; }
    .help-card__action { margin-top: .3rem; }
    .help-card__link  { font-size: .84rem; color: var(--green); text-decoration: none; }
    .help-card__link:hover { text-decoration: underline; }
    .help-card__directions {
      font-size: .82rem; color: var(--text-mid); line-height: 1.5;
      border-left: 3px solid var(--green-mid); padding: .3rem .6rem;
      background: var(--green-lt); border-radius: 0 4px 4px 0; margin-top: .2rem;
    }

    /* ══ SPINNER ════════════════════════════════════════════════ */
    .spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid #c5dece; border-top-color: var(--green);
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    @media (max-width: 360px) {
      .tab-btn { font-size: .75rem; padding: .55rem .3rem; }
      .header__app-name { font-size: 1rem; }
      .level-btn { font-size: .72rem; padding: .28rem .6rem; }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">

  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="header__row1">
      <div class="header__brand">
        <span class="header__app-name">Study Shift</span>
        <span class="header__course" id="course-label">BIOL 101</span>
      </div>
      <div class="header__right">
        <span class="sample-badge" id="sample-mode-badge" aria-live="polite">⚠ Sample content</span>
        <button class="btn-help" id="get-help-btn" type="button"
                aria-expanded="false" aria-controls="help-section-body">
          Get help
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">

    <!-- SECTION 1: Material picker -->
    <section class="picker-section" aria-labelledby="picker-label">
      <span class="picker-label" id="picker-label">Choose your material</span>
      <div class="material-list" id="material-list" role="radiogroup" aria-labelledby="picker-label">
        <!-- renderMaterialCards() -->
      </div>
      <button class="btn-study" id="study-btn" type="button" disabled>
        Start studying
      </button>
    </section>

    <!-- SECTION 2: Study area (tabs) -->
    <section class="study-area hidden" id="study-area" aria-labelledby="study-title-text">

      <div class="study-title-bar">
        <span class="study-title-bar__id" id="study-material-id"></span>
        <span class="study-title-bar__title" id="study-title-text"></span>
      </div>

      <div class="tab-bar" role="tablist" aria-label="Study views">
        <button class="tab-btn" role="tab" id="tab-review"   aria-selected="true"  aria-controls="panel-review"   type="button">Quick review</button>
        <button class="tab-btn" role="tab" id="tab-terms"    aria-selected="false" aria-controls="panel-terms"    type="button">Key terms</button>
        <button class="tab-btn" role="tab" id="tab-practice" aria-selected="false" aria-controls="panel-practice" type="button">Practice</button>
      </div>

      <div class="tab-panel active" role="tabpanel" id="panel-review" aria-labelledby="tab-review" tabindex="0">
        <div id="review-content"></div>
      </div>

      <div class="tab-panel" role="tabpanel" id="panel-terms" aria-labelledby="tab-terms" tabindex="0">
        <div id="terms-content"></div>
      </div>

      <div class="tab-panel" role="tabpanel" id="panel-practice" aria-labelledby="tab-practice" tabindex="0">
        <div id="practice-content"></div>
      </div>

    </section>

    <!-- SECTION 3: Help -->
    <section class="help-section" id="help-section" aria-labelledby="help-title">
      <div class="help-section__header">
        <span class="help-section__title" id="help-title">Need a person?</span>
        <button class="btn-toggle" id="help-toggle-btn"
                type="button" aria-expanded="false" aria-controls="help-section-body">
          Show ▾
        </button>
      </div>
      <div id="help-section-body" class="help-cards hidden">
        <!-- renderHelp() -->
      </div>
    </section>

  </main>
</div>

<script type="module">
import { COURSE, MATERIALS, QUESTION_BANK, KEY_TERMS, KEY_TERMS_ES,
         PLAIN_ENGLISH_BULLETS, HELP_OPTIONS, HELP_DIRECTORY } from './case_data.js';

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const state = {
  isSampleMode:    false,
  currentMaterial: null,
  currentQuestion: null,
  quizAnswered:    false,
  selectedOption:  null,
  // RB1: reading level and glossary language
  readingLevel:    'course',    // 'course' | 'plain'
  glossaryLang:    'en',        // 'en' | 'es'
};

/* ══════════════════════════════════════════════════════════════
   AI STUB — replace body to wire a real endpoint:
     const res = await fetch('/api/generate', {
       method: 'POST', headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({ prompt })
     });
     return res.json(); // expects { text: string }
   ══════════════════════════════════════════════════════════════ */
async function callAI(prompt) {
  throw new Error("AI service unavailable — using sample content");
}

/* ══════════════════════════════════════════════════════════════
   SAMPLE GENERATORS
   ══════════════════════════════════════════════════════════════ */
function buildCourseBullets(material) {
  const raw = material.source_text.match(/[^.!?]+[.!?]+/g) || [];
  return raw.slice(0, 5).map(s => s.trim()).filter(Boolean);
}

function pickSampleQuestion(materialId) {
  const pool = QUESTION_BANK[materialId];
  if (!pool || pool.length === 0) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function highlightTerms(text, materialId) {
  const terms = (KEY_TERMS[materialId] || []).map(t => t.term);
  if (!terms.length) return escHtml(text);
  const sorted = [...terms].sort((a, b) => b.length - a.length);
  return escHtml(text).replace(
    new RegExp(`(${sorted.map(t =>
      escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    ).join('|')})`, 'gi'),
    '<span class="term-em">$1</span>'
  );
}

function activateSampleMode() {
  if (state.isSampleMode) return;
  state.isSampleMode = true;
  document.getElementById('sample-mode-badge').classList.add('visible');
}

/** Check whether a source_excerpt actually appears in the material source_text.
 *  Used by RB2 to determine if the excerpt can be shown as provenance. */
function excerptVerified(material, excerpt) {
  if (!excerpt || !material.source_text) return false;
  // Case-insensitive substring match, ignoring leading/trailing whitespace
  return material.source_text.toLowerCase().includes(excerpt.trim().toLowerCase());
}

/** Derive week label (1-based) from position within assigned list */
function weekLabel(index) {
  return `Week ${String(index + 1).padStart(2, '0')}`;
}

function assignedIndex(materialId) {
  return MATERIALS.filter(m => m.assigned_by_instructor).findIndex(m => m.id === materialId);
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 1 — Material picker
   ══════════════════════════════════════════════════════════════ */
function renderMaterialCards() {
  const container = document.getElementById('material-list');
  const assigned  = MATERIALS.filter(m => m.assigned_by_instructor); // M06/M10 excluded

  container.innerHTML = assigned.map((m, i) => {
    const typeClass = m.type === 'reading' ? 'pill--reading' : 'pill--lecture';
    const typeLabel = m.type === 'reading' ? '📄 Reading' : '📝 Lecture Notes';
    return `
      <div class="material-card">
        <input type="radio" name="material" id="mat-${m.id}" value="${m.id}"
               aria-labelledby="mat-label-${m.id}" />
        <label class="material-card__label" id="mat-label-${m.id}" for="mat-${m.id}">
          <div class="material-card__meta">
            <span class="pill pill--week">${weekLabel(i)}</span>
            <span class="pill ${typeClass}">${typeLabel}</span>
          </div>
          <div class="material-card__title">${escHtml(m.title)}</div>
        </label>
      </div>`;
  }).join('');

  container.addEventListener('change', e => {
    if (e.target.name !== 'material') return;
    state.currentMaterial = MATERIALS.find(x => x.id === e.target.value);
    document.getElementById('study-btn').disabled = false;
  });

  document.getElementById('study-btn').addEventListener('click', onStudyClick);
}

function onStudyClick() {
  const m = state.currentMaterial;
  if (!m) return;
  resetQuizState();

  document.getElementById('study-material-id').textContent = m.id;
  document.getElementById('study-title-text').textContent  = m.title;
  document.getElementById('study-area').classList.remove('hidden');
  switchTab('review');

  renderReview(m);
  renderTerms(m);
  renderPractice(m);

  document.getElementById('study-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══════════════════════════════════════════════════════════════
   TABS
   ══════════════════════════════════════════════════════════════ */
function switchTab(name) {
  ['review','terms','practice'].forEach(id => {
    document.getElementById(`tab-${id}`).setAttribute('aria-selected', id === name ? 'true' : 'false');
    document.getElementById(`panel-${id}`).classList.toggle('active', id === name);
  });
}

function initTabs() {
  ['review','terms','practice'].forEach(id => {
    document.getElementById(`tab-${id}`).addEventListener('click', () => switchTab(id));
  });
  document.querySelector('[role="tablist"]').addEventListener('keydown', e => {
    const tabs = ['review','terms','practice'];
    const cur = tabs.findIndex(id => document.getElementById(`tab-${id}`).getAttribute('aria-selected') === 'true');
    let next = -1;
    if (e.key === 'ArrowRight') next = (cur + 1) % tabs.length;
    if (e.key === 'ArrowLeft')  next = (cur + 2) % tabs.length;
    if (next >= 0) {
      e.preventDefault();
      switchTab(tabs[next]);
      document.getElementById(`tab-${tabs[next]}`).focus();
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   RB1 HELPER — render level/lang toggle pill group
   ══════════════════════════════════════════════════════════════ */
function levelToggleHTML(currentLevel, materialId) {
  const hasPlain = !!PLAIN_ENGLISH_BULLETS[materialId];
  if (!hasPlain) return ''; // no toggle if plain-English not available
  return `
    <div class="level-toggle" role="group" aria-label="Reading level">
      <button class="level-btn" id="btn-level-course" type="button"
              aria-pressed="${currentLevel === 'course'}"
              data-level="course">Course wording</button>
      <button class="level-btn" id="btn-level-plain"  type="button"
              aria-pressed="${currentLevel === 'plain'}"
              data-level="plain">Plain English</button>
    </div>`;
}

function langToggleHTML(currentLang, materialId) {
  const hasES = !!KEY_TERMS_ES[materialId];
  if (!hasES) return ''; // no toggle if Spanish not available
  return `
    <div class="level-toggle" role="group" aria-label="Glossary language">
      <button class="level-btn" id="btn-lang-en" type="button"
              aria-pressed="${currentLang === 'en'}"
              data-lang="en">English</button>
      <button class="level-btn" id="btn-lang-es" type="button"
              aria-pressed="${currentLang === 'es'}"
              data-lang="es">Español</button>
    </div>
    ${currentLang === 'es'
      ? sampleNoticeHTML('Traducción de muestra — no verificada / Sample translation — not verified')
      : ''}`;
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 2 — Quick Review  (RB1: reading-level toggle)
   ══════════════════════════════════════════════════════════════ */
async function renderReview(material) {
  const container = document.getElementById('review-content');
  container.innerHTML = `<span class="spinner" aria-hidden="true"></span> Building review…`;

  let bullets;
  let usedSample = false;

  // Determine which bullet set to show
  const level = state.readingLevel;
  const plainBullets = PLAIN_ENGLISH_BULLETS[material.id];

  try {
    if (level === 'plain' && plainBullets) {
      // Plain English: use deterministic fallback directly (no AI needed yet)
      bullets = plainBullets;
      usedSample = true; // local fallback
    } else {
      // Course wording: try AI first
      const result = await callAI(
        `Summarize the following biology study material as 4-5 short bullets for a college student. ` +
        `Keep important course terms. Material: "${material.source_text}"`
      );
      bullets = result.text.split('\n').map(l => l.replace(/^[-•*]\s*/, '').trim()).filter(Boolean);
    }
  } catch {
    bullets = level === 'plain' && plainBullets ? plainBullets : buildCourseBullets(material);
    usedSample = true;
  }

  if (usedSample) activateSampleMode();

  _renderReviewUI(material, bullets, usedSample, level);
}

function _renderReviewUI(material, bullets, usedSample, level) {
  const container   = document.getElementById('review-content');
  const toggleHTML  = levelToggleHTML(level, material.id);
  const bulletHTML  = bullets.map(b => `<li>${highlightTerms(b, material.id)}</li>`).join('');

  container.innerHTML = `
    ${toggleHTML}
    <ul class="review-bullets" aria-label="Quick review bullets">
      ${bulletHTML}
    </ul>
    <div class="source-quote-inline">
      <span class="source-label">From ${escHtml(material.id)}</span>
      <div style="border-left:3px solid var(--green-mid);padding:.4rem .65rem;
                  background:var(--green-lt);border-radius:0 6px 6px 0;
                  font-size:.8rem;color:var(--muted);">
        ${escHtml(material.excerpt)}
      </div>
    </div>
    ${usedSample ? sampleNoticeHTML(
        level === 'plain'
          ? 'Plain English view — local fallback, not AI-generated'
          : 'Quick review built from source text'
      ) : ''}
  `;

  // Wire level-toggle buttons
  container.querySelectorAll('.level-btn[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.readingLevel = btn.dataset.level;
      renderReview(material);
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 3 — Key Terms  (RB1: Español / English toggle)
   ══════════════════════════════════════════════════════════════ */
function renderTerms(material) {
  const container = document.getElementById('terms-content');
  activateSampleMode();

  const lang  = state.glossaryLang;
  const enTerms = KEY_TERMS[material.id] || [];
  const esTerms = KEY_TERMS_ES[material.id] || null;

  if (!enTerms.length) {
    container.innerHTML = `<p style="font-size:.88rem;color:var(--muted);">No key terms loaded for this material yet.</p>`;
    return;
  }

  // Build cards using the right language
  const terms  = (lang === 'es' && esTerms) ? esTerms : enTerms;
  const isES   = lang === 'es' && !!esTerms;

  const cardsHTML = (lang === 'es' && esTerms)
    ? esTerms.map(t => `
        <div class="term-card">
          <div class="term-card__term">${escHtml(t.term)}</div>
          <div class="term-card__def">${escHtml(t.definition_es)}</div>
        </div>`)
      .join('')
    : enTerms.map(t => `
        <div class="term-card">
          <div class="term-card__term">${escHtml(t.term)}</div>
          <div class="term-card__def">${escHtml(t.definition)}</div>
        </div>`)
      .join('');

  container.innerHTML = `
    ${langToggleHTML(lang, material.id)}
    <div class="terms-list" aria-label="Key terms">
      ${cardsHTML}
    </div>
    ${sampleNoticeHTML('Terms from built-in glossary · will update from data/key_terms.csv')}
  `;

  // Wire lang-toggle buttons
  container.querySelectorAll('.level-btn[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.glossaryLang = btn.dataset.lang;
      renderTerms(material);
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 4 — Practice
   ══════════════════════════════════════════════════════════════ */
async function renderPractice(material) {
  const container = document.getElementById('practice-content');
  container.innerHTML = `<span class="spinner" aria-hidden="true"></span> Loading question…`;

  let q;
  let usedSample = false;

  try {
    await callAI(`Generate one multiple-choice question from: "${material.source_text}"`);
  } catch {
    q = pickSampleQuestion(material.id);
    usedSample = true;
  }

  if (usedSample) activateSampleMode();

  if (!q) {
    container.innerHTML = `<p style="font-size:.88rem;color:var(--muted);">No practice question available for this material yet.</p>`;
    return;
  }

  state.currentQuestion = q;
  state.quizAnswered    = false;
  state.selectedOption  = null;

  _renderPracticeUI(material, q, usedSample);
}

function _renderPracticeUI(material, q, isSample) {
  const optLetters = ['A','B','C','D'];
  const container  = document.getElementById('practice-content');

  const optionsHTML = q.options.map((opt, i) => {
    const letter = optLetters[i];
    return `
      <li>
        <input type="radio" name="practice-opt" id="opt-${letter}" value="${letter}"
               aria-label="Option ${letter}: ${escHtml(opt)}" />
        <label class="option-label" for="opt-${letter}">
          <span class="opt-letter" aria-hidden="true">${letter}<span class="opt-icon"></span></span>
          <span>${escHtml(opt)}</span>
        </label>
      </li>`;
  }).join('');

  container.innerHTML = `
    <p style="font-size:.7rem;color:var(--muted);margin-bottom:.6rem;">
      ${escHtml(material.id)} · ${escHtml(material.title)}
    </p>
    ${isSample ? `<div style="margin-bottom:.65rem;">${sampleQuestionBadgeHTML()}</div>` : ''}
    <p class="practice-q" id="practice-question-text">${escHtml(q.question)}</p>
    <ul class="options-list" role="list" aria-labelledby="practice-question-text">
      ${optionsHTML}
    </ul>
    <button class="btn-submit" id="submit-btn" type="button" disabled>
      Submit answer
    </button>
    <div class="answer-feedback" id="answer-feedback" aria-live="polite"></div>
    ${isSample ? sampleNoticeHTML('Sample question from question bank (not AI-generated)') : ''}
  `;

  container.querySelectorAll('input[name="practice-opt"]').forEach(radio => {
    radio.addEventListener('change', () => {
      state.selectedOption = radio.value;
      document.getElementById('submit-btn').disabled = false;
    });
  });

  document.getElementById('submit-btn').addEventListener('click', () => revealAnswer(material, q));
}

/* ══════════════════════════════════════════════════════════════
   COMPONENT 5 — Answer reveal  (RB2: View Source disclosure)
   ══════════════════════════════════════════════════════════════ */
function revealAnswer(material, q) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const selected  = state.selectedOption;
  const isCorrect = selected === q.answer;
  const optLetters = ['A','B','C','D'];

  optLetters.forEach(letter => {
    const label = document.querySelector(`label[for="opt-${letter}"]`);
    const icon  = label && label.querySelector('.opt-icon');
    const input = document.getElementById(`opt-${letter}`);
    if (!label) return;
    if (letter === q.answer) {
      label.classList.add('state-correct');
      if (icon) icon.textContent = ' ✓';
    } else if (letter === selected && !isCorrect) {
      label.classList.add('state-wrong');
      if (icon) icon.textContent = ' ✗';
    }
    input.disabled = true;
  });

  document.getElementById('submit-btn').disabled = true;

  const bannerClass = isCorrect ? 'correct' : 'wrong';
  const bannerText  = isCorrect
    ? '✓ Correct!'
    : `✗ Not quite — the right answer is ${q.answer}.`;

  // RB2: build View Source disclosure
  const idx      = assignedIndex(material.id);
  const week     = idx >= 0 ? weekLabel(idx) : '';
  const verified = excerptVerified(material, q.source_excerpt);
  const sourceDisclosureHTML = verified
    ? `<details class="source-disclosure">
        <summary>View source</summary>
        <div class="source-disclosure__body">
          <div class="source-disclosure__meta">
            <span class="source-meta-pill source-meta-pill--assigned">✓ Instructor-assigned</span>
            <span class="source-meta-pill source-meta-pill--mid">${escHtml(material.id)}</span>
            ${week ? `<span class="source-meta-pill source-meta-pill--mid">${escHtml(week)}</span>` : ''}
          </div>
          <span class="source-label">${escHtml(material.title)}</span>
          <p class="source-excerpt-text">"${escHtml(q.source_excerpt)}"</p>
        </div>
      </details>`
    : `<p style="font-size:.78rem;color:var(--muted);margin-top:.4rem;">
         (Supporting source excerpt not available for this question.)
       </p>`;

  const feedbackEl = document.getElementById('answer-feedback');
  feedbackEl.innerHTML = `
    <div class="feedback-banner ${bannerClass}" role="alert">${bannerText}</div>
    <div class="feedback-body">
      <p class="feedback-explanation">${escHtml(q.explanation)}</p>
      ${sourceDisclosureHTML}
    </div>
  `;
  feedbackEl.classList.add('visible');
  feedbackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ══════════════════════════════════════════════════════════════
   RB3 — Help panel (from HELP_OPTIONS)
   ══════════════════════════════════════════════════════════════ */
function renderHelp() {
  const body = document.getElementById('help-section-body');

  body.innerHTML = HELP_OPTIONS.map(h => {
    const featured    = h.id === 'online-tutoring';
    const badgeHTML   = h.is_24_7
      ? `<span class="help-card__badge help-card__badge--24h">24/7</span> `
      : '';
    const sampleHTML  = h.sample_data
      ? `<span class="help-card__badge help-card__badge--sample">Sample data</span> `
      : '';

    let actionHTML = '';
    if (h.contact_type === 'email' && h.contact_value) {
      actionHTML = `<a class="help-card__link" href="mailto:${escHtml(h.contact_value)}">${escHtml(h.contact_value)}</a>`;
    } else if (h.contact_type === 'phone' && h.contact_value) {
      actionHTML = `<a class="help-card__link" href="tel:${escHtml(h.contact_value)}">${escHtml(h.contact_value)}</a>`;
    } else if (h.contact_type === 'portal' && h.directions) {
      // Portal with no live URL: show directions instead of a dead link
      actionHTML = `<div class="help-card__directions">${escHtml(h.directions)}</div>`;
    }

    return `
      <div class="help-card${featured ? ' help-card--featured' : ''}">
        <div>${badgeHTML}${sampleHTML}</div>
        <div class="help-card__name">${escHtml(h.name)}</div>
        <div class="help-card__best">${escHtml(h.best_for)}</div>
        <div class="help-card__avail">${escHtml(h.availability)}</div>
        <div class="help-card__action">${actionHTML}</div>
      </div>`;
  }).join('');

  function openHelp() {
    body.classList.remove('hidden');
    document.getElementById('help-toggle-btn').textContent = 'Hide ▴';
    document.getElementById('help-toggle-btn').setAttribute('aria-expanded', 'true');
  }

  document.getElementById('help-toggle-btn').addEventListener('click', () => {
    const isHidden = body.classList.toggle('hidden');
    const btn = document.getElementById('help-toggle-btn');
    btn.setAttribute('aria-expanded', String(!isHidden));
    btn.textContent = isHidden ? 'Show ▾' : 'Hide ▴';
  });

  document.getElementById('get-help-btn').addEventListener('click', () => {
    openHelp();
    document.getElementById('help-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ══════════════════════════════════════════════════════════════
   QUIZ RESET
   ══════════════════════════════════════════════════════════════ */
function resetQuizState() {
  state.quizAnswered    = false;
  state.selectedOption  = null;
  state.currentQuestion = null;
  // reading level and lang persist across materials (intentional UX)
}

   HTML BUILDERS
   ══════════════════════════════════════════════════════════════ */

    <div class="sample-notice visible" role="note">
      <span class="sample-notice__icon" aria-hidden="true">ℹ</span>
      <span>Sample content — ${escHtml(msg)}</span>
    </div>`;
}

function sampleQuestionBadgeHTML() {
  return `<span style="display:inline-block;font-size:.68rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em;
    background:var(--gold-lt);border:1px solid #f5d78e;
    color:#7a5500;border-radius:999px;padding:.12rem .5rem;">
    Sample practice question
  </span>`;
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
(function boot() {
  document.getElementById('course-label').textContent =
    `${COURSE.id} · ${COURSE.section}`;
  renderMaterialCards();
  initTabs();
  renderHelp();
})();
